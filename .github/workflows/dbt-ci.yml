
name: dbt CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  dbt_ci:
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-snowflake==1.12.5

      - name: Install dbt Dependencies
        working-directory: dbt_retail
        run: dbt deps --profiles-dir . --profile dbt_retail --target ci

      - name: Validate dbt Project
        working-directory: dbt_retail
        run: dbt parse --profiles-dir . --profile dbt_retail --target ci

      - name: Run dbt Build and Tests
        working-directory: dbt_retail
        run: dbt build --profiles-dir . --profile dbt_retail --target ci
