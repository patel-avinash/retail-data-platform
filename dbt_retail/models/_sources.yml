
version: 2

sources:
  - name: retail_raw
    description: "Raw retail data ingested from CSV files into Snowflake."

    database: RETAIL_DEV
    schema: RAW

    config:
      loaded_at_field: INGESTED_AT
      freshness:
        warn_after:
          count: 1
          period: day
        error_after:
          count: 2
          period: day

    tables:
      - name: RAW_CUSTOMERS
        description: "Raw customer information."

      - name: RAW_PRODUCTS
        description: "Raw product and pricing information."

      - name: RAW_ORDERS
        description: "Raw order transaction information."

      - name: RAW_ORDER_ITEMS
        description: "Raw order item details."

      - name: RAW_PAYMENTS
        description: "Raw payment transaction information."

      - name: RAW_INVENTORY
        description: "Raw inventory information across warehouses."
